name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Download public website resources for offline use
        run: python3 tools/snapshot_site.py

      - name: Save offline download report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-download-report
          path: snapshot-report.json
          if-no-files-found: ignore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug and release APK
        run: |
          gradle assembleDebug --no-daemon
          gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
