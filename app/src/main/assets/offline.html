<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>زعيم الملاعب</title>
<style>
  html, body { margin:0; height:100%; }
  body {
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    background:#a37500; color:#fff; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    text-align:center; padding:28px;
  }
  .dot { width:52px; height:52px; border-radius:16px; background:#0B0B14; display:grid; place-items:center; font-weight:700; font-size:22px; }
  h1 { font-size:17px; margin:4px 0 0; font-weight:600; }
  p { margin:0; font-size:13px; opacity:.65; line-height:1.9; }
  button {
    margin-top:10px; border:0; border-radius:14px; padding:13px 26px; font-size:14px; font-weight:600; color:#fff;
    background:#000000; cursor:pointer;
  }
</style>
</head>
<body>
  <div class="dot">ز</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تحقّق من الشبكة ثم أعد المحاولة،<br />المحتوى المخزَّن سيفتح تلقائياً عند العودة.</p>
  <button onclick="try { AndroidApp.reload(); } catch (e) { location.href = 'https://mo-fashwan.base44.app'; }">إعادة المحاولة</button>
</body>
</html>
